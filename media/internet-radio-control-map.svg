<svg xmlns="http://www.w3.org/2000/svg" width="900" height="355" viewBox="0 0 900 355" role="img" aria-labelledby="title desc">
  <title id="title">Front-panel functional control map</title>
  <desc id="desc">Six numbered groups of controls; positions are functional, not a physical facsimile.</desc>
  <rect x="1" y="1" width="898" height="353" fill="#fff" stroke="#1b4965" stroke-width="2"/>
  <g fill="none" stroke="#1b4965" stroke-width="2">
    <rect x="20" y="55" width="270" height="115" rx="8"/>
    <rect x="315" y="55" width="270" height="115" rx="8"/>
    <rect x="610" y="55" width="270" height="115" rx="8"/>
    <rect x="20" y="190" width="270" height="115" rx="8"/>
    <rect x="315" y="190" width="270" height="115" rx="8"/>
    <rect x="610" y="190" width="270" height="115" rx="8"/>
  </g>
  <g fill="#000" font-family="sans-serif" font-size="18">
    <text x="20" y="32" font-weight="bold">FRONT PANEL — FUNCTIONAL GROUPS, NOT PHYSICAL POSITIONS</text>
    <text x="35" y="82"><tspan font-weight="bold">1</tspan>  POWER · PROGRAM</text>
    <text x="35" y="111">CHECK</text>
    <text x="330" y="82"><tspan font-weight="bold">2</tspan>  DISPLAY MODE</text>
    <text x="330" y="111">short: cycle</text>
    <text x="330" y="140">hold: DIM</text>
    <text x="625" y="82"><tspan font-weight="bold">3</tspan>  CATEGORY KEYS</text>
    <text x="625" y="111">MUSIC · SPEECH</text>
    <text x="625" y="140">see full list in table</text>
    <text x="35" y="217"><tspan font-weight="bold">4</tspan>  MEMORY</text>
    <text x="35" y="246">BLOCK − · BLOCK +</text>
    <text x="330" y="217"><tspan font-weight="bold">5</tspan>  PRESETS 1–16</text>
    <text x="330" y="246">MHz/CLEAR</text>
    <text x="330" y="275">MONO MODE</text>
    <text x="625" y="217"><tspan font-weight="bold">6</tspan>  DIRECT · LNC/LINK</text>
    <text x="625" y="246">FINE − · FINE +</text>
    <text x="20" y="335">Menu roles are proposed; check mapping and hardware readiness in the manual.</text>
  </g>
</svg>
